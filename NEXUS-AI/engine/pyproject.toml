[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-engine"
version = "1.0.0"
description = "NEXUS AI Hybrid Local-Cloud Personal Agent Engine for Android & Termux"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn>=0.17.6",
    "pydantic>=1.10.4",
    "httpx>=0.23.3",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.11.0",
    "cryptography>=38.0.0",
]
