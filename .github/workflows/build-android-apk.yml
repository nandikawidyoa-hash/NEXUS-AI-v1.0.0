name: Build NEXUS AI Android APK & Verify Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Kotlin Jetpack Compose APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-python-engine:
    name: Test Local/Cloud Python Agent Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Engine Dependencies
        run: |
          pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Engine Automated Test Suite
        working-directory: engine
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py" -v
